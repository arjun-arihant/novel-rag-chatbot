<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel RAG Chatbot</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="logo">Novel<span class="accent">RAG</span></h1>
            <div class="status" id="status">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </header>

        <main class="main">
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="welcome-message">
                        <h2>Ask questions about your novel</h2>
                        <p>Powered by local AI with grounded, citation-backed answers</p>
                    </div>
                </div>

                <form class="input-form" id="queryForm">
                    <div class="input-wrapper">
                        <textarea 
                            id="queryInput" 
                            placeholder="Ask a question about the novel..." 
                            rows="1"
                            autofocus
                        ></textarea>
                        <button type="submit" id="submitBtn" title="Send">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2L11 13"></path>
                                <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>

            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h3>Sources</h3>
                    <button class="close-btn" id="closeSidebar">&times;</button>
                </div>
                <div class="sources-list" id="sourcesList">
                    <p class="no-sources">Ask a question to see sources</p>
                </div>
            </aside>
        </main>

        <div class="ingest-modal" id="ingestModal">
            <div class="modal-content">
                <h3>Load Novel</h3>
                <p>Enter the path to your novel text file:</p>
                <input type="text" id="novelPath" placeholder="path/to/novel.txt" value="novel.txt">
                <div class="modal-actions">
                    <button id="ingestBtn">Load</button>
                    <button id="cancelIngest" class="secondary">Cancel</button>
                </div>
                <div class="ingest-status" id="ingestStatus"></div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
