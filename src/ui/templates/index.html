<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel RAG Chatbot</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <h1 class="logo">Novel<span class="accent">RAG</span></h1>
                <button class="library-toggle" id="libraryToggle" title="Library">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <span>Library</span>
                </button>
            </div>
            <div class="header-right">
                <div class="active-novel" id="activeNovel">
                    <span class="novel-label">No book selected</span>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main">
            <!-- Library Panel -->
            <aside class="library-panel" id="libraryPanel">
                <div class="library-header">
                    <h2>Your Library</h2>
                    <button class="close-btn" id="closeLibrary">&times;</button>
                </div>

                <!-- Upload Zone -->
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-content">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p>Drop a book here or <label for="fileInput" class="upload-link">browse</label></p>
                        <span class="formats">.txt, .pdf, .epub</span>
                    </div>
                    <input type="file" id="fileInput" accept=".txt,.pdf,.epub" hidden>
                </div>

                <!-- Novels List -->
                <div class="novels-list" id="novelsList">
                    <p class="empty-state">No books yet. Upload one to get started!</p>
                </div>
            </aside>

            <!-- Chat Container -->
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="welcome-message" id="welcomeMessage">
                        <div class="welcome-icon">📚</div>
                        <h2>Welcome to Novel RAG</h2>
                        <p>Upload a book and start chatting about it</p>
                        <button class="open-library-btn" id="openLibraryBtn">Open Library</button>
                    </div>
                </div>

                <form class="input-form" id="queryForm">
                    <div class="input-wrapper">
                        <textarea id="queryInput" placeholder="Ask a question about your book..." rows="1"
                            disabled></textarea>
                        <button type="submit" id="submitBtn" title="Send" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M22 2L11 13"></path>
                                <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Sources Sidebar -->
            <aside class="sources-panel" id="sourcesPanel">
                <div class="sources-header">
                    <h3>Sources</h3>
                    <button class="close-btn" id="closeSources">&times;</button>
                </div>
                <div class="sources-list" id="sourcesList">
                    <p class="no-sources">Ask a question to see sources</p>
                </div>
            </aside>
        </main>

        <!-- Processing Modal -->
        <div class="processing-modal" id="processingModal">
            <div class="modal-content processing-content">
                <div class="processing-icon">
                    <div class="spinner"></div>
                </div>
                <h3 id="processingTitle">Processing your book...</h3>
                <p id="processingStatus">Parsing chapters...</p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText">0%</p>
            </div>
        </div>

        <!-- Upload Form Modal (for title/author) -->
        <div class="upload-modal" id="uploadModal">
            <div class="modal-content">
                <h3>Add Book Details</h3>
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="bookTitle">Title</label>
                        <input type="text" id="bookTitle" placeholder="Book title">
                    </div>
                    <div class="form-group">
                        <label for="bookAuthor">Author</label>
                        <input type="text" id="bookAuthor" placeholder="Author name" value="Unknown">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">Upload</button>
                        <button type="button" class="secondary-btn" id="cancelUpload">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
