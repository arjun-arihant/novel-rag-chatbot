# Novel RAG Chatbot v2 Configuration

# Embedding model (local Ollama)
embedding:
  model: "qwen3-embedding:0.6b"
  base_url: "http://localhost:11434"
  dimension: 1024

# Query rewriter - ultra-strict, deterministic
query_rewriter:
  model: "llama3.1:8b"
  base_url: "http://localhost:11434"
  temperature: 0.0
  max_tokens: 128

# Reranker - JSON output, constrained scoring
reranker:
  model: "llama3.1:8b"
  base_url: "http://localhost:11434"
  temperature: 0.0
  max_tokens: 64

# Answer generator - grounded, concise
generator:
  model: "llama3.1:8b"
  base_url: "http://localhost:11434"
  temperature: 0.25
  max_tokens: 512

# Chunking - token-based with overlap
chunking:
  target_tokens: 500     # ~2000 chars
  min_tokens: 400
  max_tokens: 800
  overlap_tokens: 100
  malformed_threshold: 0.1  # Fallback to paragraph if >10% malformed sentences

# Retrieval parameters
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  final_top_k: 5
  rrf_k: 60              # RRF constant
  min_rerank_score: 3.0  # Refuse if top score below this

# Paths
paths:
  novel: "novel.txt"
  chroma_db: "chroma_db_v2"
  bm25_index: "bm25_index.pkl"
  chapter_index: "chapter_index_v2.json"

# UI configuration
ui:
  host: "127.0.0.1"
  port: 8000
  theme: "dark"
